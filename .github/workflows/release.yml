name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # LUMORAPLAYER_PAT is the LumoraPlayer account's token; GITLAB_TOKEN and GITFLIC_TOKEN
    # are the GitLab and GitFlic tokens. They live here rather than inline in the steps below
    # because secrets cannot be referenced in step `if:` conditions, and the steps must be
    # skipped (not fail) on forks that never set the secrets.
    env:
      MIRROR_TOKEN: ${{ secrets.LUMORAPLAYER_PAT }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITFLIC_TOKEN: ${{ secrets.GITFLIC_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Trakt credentials come from repository secrets: there is no keystore.properties on a
      # runner, and without these the published APK builds fine but ships a dead Trakt pane.
      # Unset (a fork with no secrets), they resolve to empty and the app reports itself
      # unconfigured rather than failing.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEYS: ${{ secrets.TMDB_API_KEYS }}

      - name: Install matching build-tools
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"

      - name: Sign APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Rename APK
        run: cp "${{ steps.sign_app.outputs.signedReleaseFile }}" app/build/outputs/apk/release/Lumora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-APK
          path: app/build/outputs/apk/release/Lumora.apk
          compression-level: 0

      # Release notes come from the tag's own section of CHANGELOG.md, so a release says
      # what actually changed rather than just "download the APK". The awk block takes
      # everything between this version's "## x.y" heading and the next one; if the tag has
      # no section (or the file is missing), it falls back to a generic body rather than
      # publishing an empty release.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Lumora ${GITHUB_REF_NAME}"
            echo
            awk -v ver="$VERSION" '
              $0 == "## " ver { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "### Installation"
            echo "Download the APK below and install on your Android TV, Fire TV Stick, or phone."
          } > release-notes.md
          if [ "$(grep -c '[^[:space:]]' release-notes.md)" -le 4 ]; then
            echo "No CHANGELOG entry for $VERSION - using generic notes"
            printf '## Lumora %s\n\n### Installation\nDownload the APK below and install on your Android TV, Fire TV Stick, or phone.\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          cat release-notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumora ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/Lumora.apk

      # The same release goes to the other Lumora home - whichever repository that is for
      # this one, read from the MIRROR_REPO repository variable (one value per repository) so
      # the workflow pins no repository path. Uses the LumoraPlayer token (Contents: read and
      # write on that repository) - the built-in GITHUB_TOKEN only works inside its own
      # repository. A fork without the secret or the variable skips the step rather than
      # failing the release; a tag released in either repository mirrors to the other, so
      # both sides stay in sync.
      - name: Mirror Release to the other repository
        if: startsWith(github.ref, 'refs/tags/v') && env.MIRROR_TOKEN != '' && vars.MIRROR_REPO != ''
        uses: softprops/action-gh-release@v1
        with:
          repository: ${{ vars.MIRROR_REPO }}
          token: ${{ secrets.LUMORAPLAYER_PAT }}
          tag_name: ${{ github.ref_name }}
          name: Lumora ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            app/build/outputs/apk/release/Lumora.apk

      # The same release is also published to Lumora's GitLab and GitFlic homes, so an update
      # is downloadable from any of them. Both steps are idempotent - the tag reaches both
      # GitHub repositories, so either build may run them and a re-run refreshes what it
      # already created. A fork without the secret skips the step rather than failing the
      # release, exactly like the mirror step above.
      - name: Publish to GitLab
        if: startsWith(github.ref, 'refs/tags/v') && env.GITLAB_TOKEN != ''
        run: |
          set -euo pipefail
          PROJECT="LumoraPlayer%2FLumora"
          BASE="https://gitlab.com/api/v4/projects/$PROJECT"
          ASSET="$BASE/packages/generic/lumora/$GITHUB_REF_NAME/Lumora.apk"

          # The APK goes to the generic package registry: unlike plain project uploads,
          # package files download anonymously on a public project, which is exactly what
          # the app's updater needs. The endpoint takes a raw body (--upload-file) - a
          # --form body would be stored verbatim, multipart wrapper and all.
          curl -sf --request PUT --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --upload-file app/build/outputs/apk/release/Lumora.apk "$ASSET" > /dev/null

          # Verify what anonymous clients will actually download.
          LOCAL_HASH=$(sha256sum app/build/outputs/apk/release/Lumora.apk | cut -d' ' -f1)
          REMOTE_HASH=$(curl -sf "$ASSET" | sha256sum | cut -d' ' -f1)
          if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
            echo "GitLab asset mismatch: $REMOTE_HASH != $LOCAL_HASH"
            exit 1
          fi

          if [ "$(curl -s -o /dev/null -w '%{http_code}' --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$BASE/releases/$GITHUB_REF_NAME")" = "200" ]; then
            curl -sf --request PUT --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "name=Lumora $GITHUB_REF_NAME" \
              --data-urlencode "description=$(cat release-notes.md)" \
              "$BASE/releases/$GITHUB_REF_NAME" > /dev/null
          else
            curl -sf --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data-urlencode "name=Lumora $GITHUB_REF_NAME" \
              --data-urlencode "tag_name=$GITHUB_REF_NAME" \
              --data-urlencode "description=$(cat release-notes.md)" \
              "$BASE/releases" > /dev/null
          fi

          # Replace the APK link so repeated runs don't stack duplicate links on the release.
          for LINK_ID in $(curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$BASE/releases/$GITHUB_REF_NAME/assets/links" | jq -r '.[].id'); do
            curl -sf --request DELETE --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$BASE/releases/$GITHUB_REF_NAME/assets/links/$LINK_ID" > /dev/null
          done
          curl -sf --request POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data-urlencode "name=Lumora.apk" --data-urlencode "url=$ASSET" \
            --data-urlencode "link_type=package" \
            "$BASE/releases/$GITHUB_REF_NAME/assets/links" > /dev/null

      - name: Publish to GitFlic
        if: startsWith(github.ref, 'refs/tags/v') && env.GITFLIC_TOKEN != ''
        run: |
          set -euo pipefail
          BASE="https://api.gitflic.ru/project/lumora/lumora"

          # Reuse the release when the other repository's build already created it, and skip
          # the upload when its APK is already attached, so two builds converge on one
          # release with one file.
          RELEASES=$(curl -s --header "Authorization: token $GITFLIC_TOKEN" "$BASE/release?size=100")
          RELEASE_ID=$(echo "$RELEASES" | jq -r --arg tag "$GITHUB_REF_NAME" '._embedded.releaseTagModelList[] | select(.tagName == $tag) | .id' | head -1)
          FILE_COUNT=$(echo "$RELEASES" | jq -r --arg tag "$GITHUB_REF_NAME" '[._embedded.releaseTagModelList[] | select(.tagName == $tag) | (.attachmentFiles // [])[] | select(.name == "Lumora.apk")] | length')

          if [ -z "$RELEASE_ID" ]; then
            RELEASE_ID=$(jq -n --arg title "Lumora $GITHUB_REF_NAME" --arg tag "$GITHUB_REF_NAME" \
              --rawfile description release-notes.md \
              '{title: $title, description: $description, tagName: $tag, preRelease: false, attachProjectArchive: false}' \
              | curl -sf --request POST --header "Authorization: token $GITFLIC_TOKEN" \
                  --header "Content-Type: application/json" --data @- "$BASE/release" | jq -r '.id')
          fi

          if [ "$FILE_COUNT" = "0" ]; then
            curl -sf --request POST --header "Authorization: token $GITFLIC_TOKEN" \
              --form "files=@app/build/outputs/apk/release/Lumora.apk" \
              "$BASE/release/$RELEASE_ID/file" > /dev/null
          fi

          # Verify the attachment matches the built APK.
          STORED_SIZE=$(curl -s --header "Authorization: token $GITFLIC_TOKEN" "$BASE/release/$RELEASE_ID" | jq -r '.attachmentFiles[] | select(.name == "Lumora.apk") | .size' | head -1)
          EXPECTED_SIZE=$(stat -c%s app/build/outputs/apk/release/Lumora.apk)
          if [ "$STORED_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "GitFlic attachment size mismatch: $STORED_SIZE != $EXPECTED_SIZE"
            exit 1
          fi
