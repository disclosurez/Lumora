name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Lumora.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumora-APK
          path: app/build/outputs/apk/release/Lumora.apk
          compression-level: 0

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumora ${{ github.ref_name }}
          body: |
            ## Lumora ${{ github.ref_name }}

            ### Installation
            Download the APK below and install on your Android TV or phone.
          files: |
            app/build/outputs/apk/release/Lumora.apk
