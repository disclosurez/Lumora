org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
# The vendored legacy Android Auto SDK (app/libs/aauto.aar) still references the old
# android.support.v4 classes (CarActivity's base class touches FragmentManager in its
# static initialiser). Without jetifier the projection service dies at class load with
# NoClassDefFoundError: android/support/v4/app/FragmentManager, taking the car screen
# with it. Same aar, same setting as fcaronte/AABrowser.
android.enableJetifier=true
android.nonTransitiveRClass=true
kotlin.code.style=official
